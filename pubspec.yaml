name: hovr_ride_map
description: Native Google Maps platform views and ride map channels for HOVR rider apps.
version: 1.0.3
homepage: https://github.com/vishalsharma-hovr/hovr_ride_map
repository: https://github.com/vishalsharma-hovr/hovr_ride_map
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.hovr.hovr_ride_map
        pluginClass: HovrRideMapPlugin
      ios:
        pluginClass: HovrRideMapPlugin
